[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pensioen"
version = "0.1.0"
description = "Nederlandse pensioenplanning en cashflowprognoses voor een huishouden"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "plotly>=5.22",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
ola = [
    "playwright>=1.49,<2",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing -v"
markers = [
    "bouwsteen: directe test van één functionele berekenbouwsteen",
    "engine: samengestelde test van rekenengine of scenarioflow",
    "contract: API-, DTO- of integratiecontract",
    "referentie: vergelijking met externe of genormaliseerde referentiedata",
    "presentatie: contract van UI-, grafiek- of rapportageconsument",
]

[tool.setuptools.packages.find]
where = ["src"]
