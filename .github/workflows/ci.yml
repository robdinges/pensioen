name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python regressie- en contractpoort
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Guard baseline changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          BASELINE_PATH="tests/fixtures/belasting_testcases/api_regressie_baseline.json"
          changed=""

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            changed=$(git diff --name-only "origin/$BASE_REF...HEAD" || true)
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            changed=$(git diff --name-only HEAD~1 HEAD || true)
          fi

          if echo "$changed" | grep -qx "$BASELINE_PATH"; then
            if [[ "$PR_TITLE" == *"[baseline-update]"* ]]; then
              echo "Baseline change toegestaan via PR marker [baseline-update]."
              exit 0
            fi
            echo "Baseline gewijzigd zonder expliciete toestemming."
            echo "Voeg [baseline-update] toe aan de PR-titel."
            exit 1
          fi

      - name: Fixture normalisatiedrift
        run: PYTHONPATH=src:. python tools/normalize_testcases.py --check

      - name: Bouwsteen- en contracttests
        run: python -m pytest -m "bouwsteen or contract" -q

      - name: Volledige Python-suite
        run: python -m pytest tests/ -q

      - name: Extern IB-2025-validatierapport
        continue-on-error: true
        run: PYTHONPATH=src:. python tools/test_validatie_pipeline.py --strict

  react:
    name: React productiepoort
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Frontend regression tests
        run: npm test

      - name: Production build
        run: npm run build
